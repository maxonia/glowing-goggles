
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои задачи по дате</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
body { font-family: Arial, sans-serif; background: #fffdf6; margin: 0;}
.header{  width: 100%;
    background: #ff9800;
    color: #fff;
    font-weight: 700;
    font-size: 1.3rem;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
}

        .task-list {
            max-width: 400px;
            margin: 34px auto 0 auto;
            padding: 0 10px;
        }
        .task-card {
            background: #fffbea;
            border-radius: 8px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.06);
            margin-bottom: 18px;
            padding: 15px 13px;
            word-break: break-word;
            position: relative;
        }
        .task-main {
            font-weight: 700;
            font-size: 1.1rem;
            color: #444;
        }
        .task-comment {
            color: #757575;
            font-size: 0.97em;
            margin: 3px 0 5px 0;
        }
        .task-date {
            font-size: 0.94em;
            color: #ff9800;
            position: absolute;
            right: 18px;
            bottom: 13px;
        }
        .date-picker-form {
            text-align: center;
            margin: 32px 0 12px 0;
        }
        .date-input {
            padding: 10px 13px;
            border: 1px solid #ff9800;
            border-radius: 7px;
            font-size: 1.09rem;
            color: #ff9800;
            background: #fffbea;
            margin: 0 10px 0 0;
        }
        .date-btn {
            background: #ff9800;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .date-btn:hover {
            background: #fb8c00;
        }
        @media (max-width: 600px) {
            .date-picker-form {
                margin: 12px 0 2px 0;
            }
            .date-input {
                font-size: 1rem;
                padding: 7px 7px;
            }
            .date-btn {
                padding: 6px 12px;
                font-size: .97rem;
            }
        }
                .footer-menu {
            position: fixed;
            left: 0; bottom: 0; width: 100%;
            background: #ffae38;
            border-radius: 0 0 10px 10px;
            display: flex; justify-content: center;
            box-shadow: 0 -3px 14px rgba(254,147,0,0.05);
            z-index: 99;
        }
        .footer-menu nav {width: 100%; display: flex;}
        .footer-menu button {
            background: none; border: none; flex: 1;
            padding: 12px 0; color: #fff; text-align: center;
            font-size: 1em; cursor: pointer;
        }
        .footer-menu button .icon {display: block; font-size: 1.5em;}
        .footer-menu button.selected {
            background: #ffa400;
            border-radius: 8px 8px 0 0;
        }
        .task-importance {
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 8px;
    display: inline-block;
    margin-bottom: 7px;
    font-size: 1em;
}
.importance-high {
    background: #ff4949;
    color: white;
}
.importance-medium {
    background: #ffd447;
    color: #333;
}
.importance-low {
    background: #68d957;
    color: white;
}
    </style>
</head>
<body>
    <div class="header">
        Ассистент
    </div>

    <!-- Форма выбора даты -->
    <form class="date-picker-form" method="get">
        <input
            type="date"
            name="date"
            class="date-input"
            value="{{ selected_date|date:'Y-m-d' }}"
            required
        >
        <button class="date-btn" type="submit">Показать</button>
    </form>
<div class="task-list">
    {% if tasks %}
        {% for task in tasks %}
            <div class="task-card">
                <!-- Важность задачи -->
 <div class="task-importance importance-{{ task.priority }}">
    {{ task.get_priority_display }}
</div>
                <div class="task-main">{{ task.text }}</div>
                {% if task.comment %}
                    <div class="task-comment">{{ task.comment }}</div>
                {% endif %}
                <div class="task-date">{{ task.date }}</div>
            </div>

        {% endfor %}
    {% else %}
        <p style="text-align:center; color:#888; margin-top: 28px;">
            Задачи на {{ selected_date|date:"d.m.Y" }} отсутствуют <br>
            <span style="font-size:2rem; display:inline-block;"></span>
        </p>
    {% endif %}
</div>
</body>

    <footer class="footer-menu">
        <nav>
            <button onclick="window.location.href='{% url 'index' %}'">
                <span class="icon">&#8962;</span>
                Главный
            </button>
            <button onclick="window.location.href='{% url 'notes_list' %}'">
                <span class="icon">&#128197;</span>
                Заметки
            </button>
            <button onclick="window.location.href='{% url 'tasks' %}'">
                <span class="icon">&#9776;</span>
                Задачи
            </button>
            <button onclick="window.location.href='{% url 'profile' %}'">
                <span class="icon">&#128100;</span>
                Кабинет
            </button>
        </nav>
    </footer>
</html>
