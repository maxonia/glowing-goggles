<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в аккаунт</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- это теперь есть! -->
    <style>
        body {
            background: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
        }
        .header {
            background: #ff9800;
            padding: 24px 0 16px 60px;
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header a {
            margin-right: 48px;
            background: #fff;
            color: #ff9800;
            padding: 7px 21px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #fff;
            transition: background .18s;
        }
        .header a:hover {
            background: #ffe0b2;
            border: 1px solid #ff9800;
        }
        .register-form-container {
            max-width: 400px;
            margin: 60px auto 0 auto;
            padding: 36px 30px;
            border-radius: 14px;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.08);
            border-top: 4px solid #ff9800;
            background: #fff;
            box-sizing: border-box;
        }
        .register-title {
            color: #ff9800;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .register-form label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #434343;
            font-weight: 500;
        }
        .register-form input {
            width: 100%;
            padding: 11px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            background: #f8f8f8;
            font-size: 1rem;
            transition: border-color .16s;
            box-sizing: border-box;
        }
        .register-form input:focus {
            border-color: #ff9800;
            outline: none;
            background: #fff;
        }
        .register-btn {
            width: 100%;
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: background .18s;
        }
        .register-btn:hover {
            background: #fb8c00;
        }
        .register-bottom-text {
            text-align: center;
            margin-top: 12px;
        }
        .register-bottom-text a {
            color: #ff9800;
            text-decoration: underline;
            font-weight: bold;
        }
        .errorlist {
            color: #b02a37;
            font-size: 0.97rem;
        }

        /* Мобильная адаптация */
        @media (max-width: 600px) {
            .header {
                padding: 14px 10px 10px 14px;
                font-size: 1.18rem;
                flex-direction: row;
            }
            .header a {
                margin-right: 10px;
                padding: 5px 10px;
                font-size: 0.97rem;
            }
            .register-form-container {
                max-width: 98vw;
                margin: 18px auto 0 auto;
                padding: 16px 2vw;
                border-radius: 9px;
                box-shadow: 0 2px 10px 0 rgba(0,0,0,0.06);
                border-top-width: 2px;
            }
            .register-title {
                font-size: 1.08rem;
                margin-bottom: 14px;
            }
            .register-form label {
                font-size: 0.97rem;
                margin-bottom: 3px;
            }
            .register-form input {
                padding: 7px;
                font-size: 0.93rem;
                margin-bottom: 10px;
            }
            .register-btn {
                padding: 9px;
                font-size: 1rem;
            }
            .register-bottom-text, .register-policy {
                font-size: 0.83rem;
                margin-top: 6px;
            }
        }

        /* Супермаленькие экраны */
        @media (max-width: 370px) {
            .header {
                font-size: 1rem;
                padding: 10px 3px 8px 7px;
            }
            .register-form-container {
                padding: 8px 1vw;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <span>Ассистент</span>
    </div>
    <div class="register-form-container">
        <div class="register-title">Вход в аккаунт</div>
        <form class="register-form" method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="errorlist">
                    Проверьте правильность логина и пароля
                </div>
            {% endif %}
            <label for="id_username">Логин:</label>
            <input type="text" name="username" id="id_username" required>
            <label for="id_password">Пароль:</label>
            <input type="password" name="password" id="id_password" required>
            <button type="submit" class="register-btn">Войти</button>
        </form>
        <div class="register-bottom-text">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
