<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить заметку</title>
    <style>
body { font-family: Arial, sans-serif; background: #fffdf6; margin: 0;}

.header {
    width: 100%;
    background: #ff9800;
    color: #fff;
    font-weight: 700;
    font-size: 1.3rem;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
}

.header a {
    margin-right: 48px;
    background: #fff;
    color: #ff9800;
    padding: 7px 21px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 5px;
    border: 1px solid #fff;
    transition: background .18s;
}
.header a:hover {
    background: #ffe0b2;
    border: 1px solid #ff9800;
}

.task-form-container {
    max-width: 400px;
    margin: 60px auto 0 auto;
    padding: 36px 30px;
    border-radius: 14px;
    box-shadow: 0 4px 24px 0 rgba(0,0,0,0.08);
    border-top: 4px solid #ff9800;
    background: #fff;
}

.task-title {
    color: #ff9800;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 24px;
}

.task-form label {
    display: block;
    font-size: 1.1rem;
    margin-bottom: 6px;
    color: #434343;
    font-weight: 500;
}

.task-form input,
.task-form textarea {
    width: 100%;
    padding: 11px;
    margin-bottom: 16px;
    border: 1px solid #e0e0e0;
    border-radius: 5px;
    background: #f8f8f8;
    font-size: 1rem;
    transition: border-color .16s;
}

.task-form input:focus,
.task-form textarea:focus {
    border-color: #ff9800;
    outline: none;
    background: #fff;
}

.task-btn {
    width: 100%;
    background: #ff9800;
    color: #fff;
    border: none;
    padding: 12px;
    font-size: 1.1rem;
    border-radius: 5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s;
}
.task-btn:hover {
    background: #fb8c00;
}

.errorlist {
    color: #b02a37;
    font-size: 0.97rem;
    margin-bottom: 12px;
}

.task-list {
    max-width: 400px;
    margin: 34px auto 0 auto;
    padding: 0 10px;
}

.task-card {
    background: #fffbea;
    border-radius: 8px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.06);
    margin-bottom: 18px;
    padding: 15px 13px;
    word-break: break-word;
    position: relative;
}

/* Доп. — Можно для note-accordion */
.note-title-accordion {
    cursor: pointer;
    padding: 8px 0;
    color: #444;
    font-size: 1.13rem;
    font-weight: bold;
    transition: color .15s;
}
.note-title-accordion:hover { color: #ff9800; }
.note-body {
    display: none;
    margin-top: 8px;
    color: #757575;
    font-size: 0.98em;
    background: #fff3e0;
    border-radius: 6px;
    padding: 9px 12px;
}
.task-card.open .note-body {
    display: block;
    animation: fadeIn 0.18s;
}
@keyframes fadeIn {
    from { opacity: 0;}
    to   { opacity: 1;}
}

.task-main {
    font-weight: 700;
    font-size: 1.1rem;
    color: #444;
}

.task-comment {
    color: #757575;
    font-size: 0.97em;
    margin: 3px 0 5px 0;
}

.task-date {
    font-size: 0.94em;
    color: #ff9800;
    position: absolute;
    right: 18px;
    bottom: 13px;
    /* Мобильные стили пониже! */
}

/* Фиксированный футер для мобилок */
.footer-menu {
    position: fixed;
    left: 0; bottom: 0; width: 100%;
    background: #ffae38;
    border-radius: 0 0 10px 10px;
    display: flex; justify-content: center;
    box-shadow: 0 -3px 14px rgba(254,147,0,0.05);
    z-index: 99;
}
.footer-menu nav {width: 100%; display: flex;}
.footer-menu button {
    background: none; border: none; flex: 1;
    padding: 12px 0; color: #fff; text-align: center;
    font-size: 1em; cursor: pointer;
}
.footer-menu button .icon {display: block; font-size: 1.5em;}
.footer-menu button.selected {
    background: #ffa400;
    border-radius: 8px 8px 0 0;
}

               /* ------- Мобильная адаптация --------*/
@media (max-width: 600px) {
    .header {
        padding: 14px 10px 12px 12px;
        font-size: 1.07rem;
    }
    .header a {
        margin-right: 2vw;
        padding: 5px 10px;
        font-size: 0.96rem;
    }
    .task-form-container {
        max-width: 98vw;
        margin: 18px auto 0 auto;
        padding: 13px 4vw 15px 4vw;
        border-radius: 9px;
        box-shadow: 0 2px 10px 0 rgba(0,0,0,0.08);
        border-top-width: 2px;
    }
    .task-title {
        font-size: 1.08rem;
        margin-bottom: 11px;
    }
    .task-form label {
        font-size: 0.99rem;
        margin-bottom: 4px;
    }
    .task-form input, .task-form textarea {
        padding: 7px;
        font-size: 0.95rem;
        margin-bottom: 10px;
    }
    .task-btn {
        padding: 9px;
        font-size: 0.96rem;
    }
    .task-list {
        max-width: 98vw;
        margin: 12px auto 0 auto;
        padding: 4px 2vw;
    }
    .task-card {
        padding: 10px 6px;
        font-size: 0.96rem;
    }
    .task-date {
        right: 6vw;
        bottom: 7px;
        font-size: 0.87em;
        position: static;
        display: block;
        margin-top: 6px;
        text-align: right;
    }
    .footer-menu {
        font-size: 0.93em;
        border-radius: 0;
        padding-bottom: env(safe-area-inset-bottom);
    }
}
    </style>
</head>
<body>
<div class="header">
    <span>Добавить заметку</span>
    <a href="{% url 'notes_list' %}">⟵ Назад</a>
</div>

<div class="task-form-container">
    <div class="task-title">Новая заметка</div>
    <form method="post" class="task-form">
        {% csrf_token %}
        <label for="title">Заголовок</label>
        <input type="text" name="title" id="title" maxlength="100" placeholder="Без названия">

        <label for="body">Содержание</label>
        <textarea name="body" id="body" rows="5" required placeholder="Текст заметки"></textarea>

        <button type="submit" class="task-btn">Сохранить</button>
    </form>
</div>
</body>

</html>
